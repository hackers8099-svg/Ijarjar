name: Build Ijar Jar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Check 3D phone models
        continue-on-error: true
        run: |
          gradle :app:testReleaseUnitTest --tests '*PhoneGlbTest*' --console=plain -q
          cd app/build/phones && npm i -s gltf-validator >/dev/null 2>&1
          node -e "
            const v=require('gltf-validator'),fs=require('fs');
            (async()=>{let out=[];for(const f of fs.readdirSync('.').filter(x=>x.endsWith('.glb'))){
              const r=await v.validateBytes(new Uint8Array(fs.readFileSync(f)));
              out.push(f+': errors='+r.issues.numErrors+' warnings='+r.issues.numWarnings+' '+r.issues.messages.filter(m=>m.severity<=1).slice(0,6).map(m=>m.code+'@'+m.pointer).join(' '));}
              console.log('::warning title=GLB check::'+out.join(' | '));})();"

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception|> " build.log | head -60 > errors.txt || true
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
            echo "::error title=Build errors::$msg"
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ijarjar.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: phones
          path: app/build/phones/*.glb

      - uses: actions/upload-artifact@v4
        with:
          name: IjarJar-APK
          path: out/ijarjar.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ijar Jar v1.0.${{ github.run_number }}
          files: out/ijarjar.apk
          make_latest: true
